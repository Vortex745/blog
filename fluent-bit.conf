[SERVICE]
    Flush                     5
    Parsers_File              /fluent-bit/etc/parsers.conf
    storage.path              /state/buffer
    storage.type              filesystem

[INPUT]
    Name                      tail
    Path                      /var/lib/docker/containers/*/*.log
    Parser                    docker
    Tag                       docker.*
    Path_Key                  container_id
    DB                        /state/tail.db
    storage.type              filesystem

# Rewrite the tag to the bare compose service name. Compose already labels each
# container with com.docker.compose.service, and the json-file driver copies that
# label into the record's attrs (log-opts labels), so no docker socket is needed.
# Non-compose containers keep their docker.* tag and match no output below.
[FILTER]
    Name                      rewrite_tag
    Match                     docker.*
    Rule                      $attrs['com.docker.compose.service'] ^(.*)$ $1 false

# One output per service so each container gets its own OpenObserve stream
# (org "default"): the http output in this image does not expand $TAG in the
# URI, so the stream name must be spelled out per tag. When compose gains a
# service, add a matching block here.
[OUTPUT]
    Name                      http
    Match                     blog
    Host                      openobserve
    Port                      5080
    URI                       /api/default/blog/_json
    Format                    json
    Json_date_key             _timestamp
    Json_date_format          iso8601
    HTTP_User                 ${ZO_ROOT_USER_EMAIL}
    HTTP_Passwd               ${ZO_ROOT_USER_PASSWORD}
    Retry_Limit               False

