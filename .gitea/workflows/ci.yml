name: Blog CI

on:
  push:
  pull_request:
  workflow_dispatch:

# The runner has capacity 1; cancel superseded runs instead of letting them queue.
concurrency:
  group: ${{ gitea.workflow }}-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Test and production image
    runs-on: blog-ci
    # Slowest observed run is ~3min (cold dependency change); 15min leaves
    # headroom without letting a hang block the capacity-1 runner queue.
    timeout-minutes: 15
    env:
      COMMIT_SHA: ${{ gitea.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Dockerfile `test` stage: npm ci + npm test + tsc on Linux with native
      # SQLite binaries. Untagged: the image is never consumed, only its exit
      # code — skipping the export saves ~29s on dependency-change builds and
      # stops per-SHA test images accumulating on the runner disk.
      - name: Run application tests and typecheck in Linux
        run: docker build --target test .

      # Dockerfile `runtime` stage: astro build, prune to production deps, then load
      # better-sqlite3 to prove the native module works in the runtime image.
      - name: Build production image and verify SQLite native modules
        run: docker build --target runtime --tag "changye-blog-ci:$COMMIT_SHA" .

      # Every run leaves one image per commit; drop only what nothing references anymore.
      - name: Prune dangling images
        if: always()
        run: docker image prune --force
