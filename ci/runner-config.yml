log:
  level: info

runner:
  file: /data/.runner
  capacity: 1
  timeout: 1h
  insecure: false

# No cache actions are used; avoid exposing an extra cache listener.
cache:
  enabled: false

container:
  network: ""
  privileged: false
  valid_volumes: []
  docker_host: unix:///var/run/docker.sock
  force_pull: false

  # Job images are built locally on the dedicated host before registration.
  require_docker: true
