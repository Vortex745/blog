services:
  blog:
    build:
      context: .
      dockerfile: Dockerfile
    image: changye-blog:local
    init: true
    restart: unless-stopped
    expose:
      - "4321"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "4321"
      # Container paths take precedence over paths in the mounted .env.
      SQLITE_DB_PATH: /app/data/blog.sqlite
      UPLOAD_DIR: /app/dist/client/uploads
      # Agent sidecar (nanobot bridge) reachable only inside the compose network.
      AGENT_BRIDGE_URL: http://agent:8000
      AGENT_BRIDGE_TOKEN: ${AGENT_BRIDGE_TOKEN:-}
    volumes:
      # Persist the SQLite database together with its WAL/SHM files.
      - type: bind
        source: ./data
        target: /app/data
      # Astro standalone serves static files from dist/client.
      - type: bind
        source: ./public/uploads
        target: /app/dist/client/uploads
      # The admin UI writes AI settings here; Node reloads it on restart.
      - type: bind
        source: ./.env
        target: /app/.env
        bind:
          create_host_path: false
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  agent:
    build: ./agent
    init: true
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-}
      AGENT_BRIDGE_TOKEN: ${AGENT_BRIDGE_TOKEN:-}
      AGENT_SESSION_TTL_DAYS: ${AGENT_SESSION_TTL_DAYS:-}
    volumes:
      # Persist config.json and sessions.sqlite3 for the nanobot runtime.
      - type: bind
        source: ./data/agent
        target: /app/config
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      blog:
        condition: service_healthy
      gitea:
        condition: service_started
    ports:
      - "80:80"
    volumes:
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  gitea:
    image: docker.gitea.com/gitea:28.0.0
    restart: unless-stopped
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__database__DB_TYPE: sqlite3
      GITEA__database__PATH: /data/gitea/gitea.db
      GITEA__server__DOMAIN: git.zijin.online
      GITEA__server__ROOT_URL: http://git.zijin.online/
      GITEA__server__HTTP_ADDR: 0.0.0.0
      GITEA__server__HTTP_PORT: "3000"
      GITEA__server__SSH_DOMAIN: git.zijin.online
      GITEA__server__SSH_PORT: "2222"
      GITEA__actions__ENABLED: "true"
      GITEA__actions__DEFAULT_ACTIONS_URL: github
      GITEA__service__DISABLE_REGISTRATION: "true"
    expose:
      - "3000"
    ports:
      - "2222:22"
    volumes:
      # Includes repositories, SQLite, app.ini and generated instance secrets.
      - gitea-data:/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1:3000/api/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  gitea-data:
