map $http_upgrade $gitea_connection_upgrade {
    default upgrade;
    "" close;
}

server {
    listen 80;
    server_name _;

    # The application accepts 32 MB images; allow multipart form overhead.
    client_max_body_size 40m;

    location / {
        proxy_pass http://blog:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Deliver AI response chunks immediately instead of buffering them.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}

server {
    listen 80;
    server_name git.zijin.online;
    client_max_body_size 128m;

    # Re-resolve Gitea after a container recreation without restarting Nginx.
    resolver 127.0.0.11 valid=10s;
    set $gitea_upstream gitea:3000;

    location / {
        proxy_pass http://$gitea_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $gitea_connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
